<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活断層くん</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#162130">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="d3.min.js"></script>
<style>
:root{
  --bg:#f6f4ef; --ink:#1f2328; --muted:#6b6f76; --line:#d9d5cc;
  --sea:#dfe9ef; --land:#fbfaf6; --landOff:#eeece6; --sel:#fff4c8;
  --S:#d62728; --A:#f08c00; --Z:#2b7bba; --X:#8e5bb5; --R:#9aa0a6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif}
header{padding:12px 16px 8px;border-bottom:1px solid var(--line);background:#fff}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chips .lab{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;
  font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip:hover{border-color:#999}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.reg{font-weight:600}
.brk{flex-basis:100%;height:0}
body{display:flex;flex-direction:column}
main{display:flex;flex:1;min-height:0}
#mapwrap{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block;background:var(--sea);touch-action:none}
.pref{stroke:#b9b4a8;stroke-width:.7;vector-effect:non-scaling-stroke;fill:var(--landOff)}
.pref.click{fill:var(--land);cursor:pointer}
.pref.click:hover{fill:#fffbe6}
.pref.regsel{fill:#fffbe6}
.pref.sel{fill:var(--sel);stroke:#a58a00;stroke-width:1.6}
.fl{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke;cursor:pointer}
.fl.R{stroke:var(--R);stroke-width:1.1;stroke-dasharray:3 2}
.fl.S{stroke:var(--S);stroke-width:3}
.fl.A{stroke:var(--A);stroke-width:2.4}
.fl.Z{stroke:var(--Z);stroke-width:2.2}
.fl.X{stroke:var(--X);stroke-width:2.2}
.fl.dim{opacity:.25}
.fl.hl{stroke-width:6 !important;opacity:1}
.plabel{font-size:11px;fill:#6d675c;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#fbfaf6;stroke-width:3px}
.flabel{font-size:12px;font-weight:700;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3.5px}
#legend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.55}
#legend summary{cursor:pointer;list-style-position:inside}
#legend i{display:inline-block;width:20px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
#zoombtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#zoombtns button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:16px;cursor:pointer}
#locbtn{font-size:15px !important}
#locbtn.gps{background:#1a73e8 !important;border-color:#1a73e8 !important}
#locbox{position:absolute;right:50px;top:10px;width:290px;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:10px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.12);display:none;line-height:1.55}
#locbox input{width:100%;font-size:14px;padding:6px 8px;border:1px solid #bbb;border-radius:6px;margin:6px 0;font-family:inherit}
#locbox .row{display:flex;gap:6px;flex-wrap:wrap}
#locbox button{font-family:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);background:#f7f7f7;border-radius:6px;cursor:pointer}
#locbox button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
#locbox .err{color:#b42318;margin-top:4px}
#pickhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;display:none}
.me-halo{fill:rgba(26,115,232,.18);stroke:none;pointer-events:none}
.me-dot{fill:#1a73e8;stroke:#fff;pointer-events:none}
.locblk{border:2px solid #1a73e8;border-radius:8px;padding:8px 10px;margin-bottom:12px;background:#f3f8ff}
.locblk .t{font-weight:700;font-size:13.5px;color:#1a4fa0}
.locblk .c{font-size:11.5px;color:var(--muted)}
.near{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-top:1px dotted #c9d8ee;cursor:pointer}
.near:first-of-type{border-top:none}
.near .d{margin-left:auto;font-weight:700;white-space:nowrap}

/* ---- background styles ---- */
.nb{stroke:#cfcabe;stroke-width:.6;vector-effect:non-scaling-stroke;fill:#efede7;pointer-events:none}
.urban{fill:#f2dccb;stroke:none;pointer-events:none}
.lake{fill:#cfe0ea;stroke:#a9c3d3;stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none}
.river{fill:none;stroke:#8fb6cf;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.road{fill:none;stroke:#c9c1b2;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.road.m{stroke:#9b927f;stroke-width:1.7}
.rail{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
.cdot{fill:#333;stroke:#fff;pointer-events:none}
.clabel{fill:#333;pointer-events:none;paint-order:stroke;stroke:#fff;font-weight:600}
.lay-road,.lay-city{display:none}
body.bg-road .lay-road, body.bg-road .lay-city{display:inline}
body.bg-std .lay-city, body.bg-dark .lay-city{display:inline}
body.bg-white svg{background:#fff}
body.bg-white .pref{fill:#fff;stroke:#777}
body.bg-white .pref.click:hover{fill:#f6f6f6}
body.bg-white .pref.sel{fill:#fff7cc;stroke:#a58a00}
body.bg-white .nb{fill:#fff;stroke:#bbb}
body.bg-white .plabel{fill:#555;stroke:#fff}
body.bg-dark svg{background:#0e1621}
body.bg-dark .pref{fill:#1c2633;stroke:#3d4b5c}
body.bg-dark .pref.click:hover{fill:#243243}
body.bg-dark .pref.regsel{fill:#212f40}
body.bg-dark .pref.sel{fill:#2c3d52;stroke:#d9b84a}
body.bg-dark .nb{fill:#161e29;stroke:#2a3644}
body.bg-dark .plabel{fill:#9fb0c3;stroke:#0e1621}
body.bg-dark .clabel{fill:#dfe7f0;stroke:#0e1621}
body.bg-dark .cdot{fill:#dfe7f0;stroke:#0e1621}
body.bg-dark .fl.R{stroke:#6b7787}
body.bg-dark .flabel{stroke:#0e1621}
#bgctl{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;display:flex;align-items:center;gap:6px}
#bgctl select{font-family:inherit;font-size:13px;padding:3px 4px;border:1px solid #bbb;border-radius:5px;background:#fff}
#measbox{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;border:2px solid #111;border-radius:10px;
  padding:8px 12px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:none;text-align:center;min-width:250px;z-index:5}
#measbox .tot{font-size:20px;font-weight:800;margin:2px 0}
#measbox .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
#measbox button{font-family:inherit;font-size:12.5px;padding:4px 9px;border:1px solid var(--line);background:#f7f7f7;border-radius:6px;cursor:pointer}
#measbox button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
#measbtn.on{background:#111;color:#fff}
.ms-line-h{fill:none;stroke:#fff;vector-effect:non-scaling-stroke;stroke-width:5;pointer-events:none}
.ms-line{fill:none;stroke:#111;vector-effect:non-scaling-stroke;stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.ms-pt{fill:#fff;stroke:#111;pointer-events:none}
.ms-lab{fill:#111;font-weight:700;paint-order:stroke;stroke:#fff;pointer-events:none}
body.bg-dark .ms-line{stroke:#fff} body.bg-dark .ms-line-h{stroke:#000} body.bg-dark .ms-pt{fill:#000;stroke:#fff}
body.bg-dark .ms-lab{fill:#fff;stroke:#000}

/* ---- tile backgrounds (地理院タイル) ---- */
#gTile image{pointer-events:none}
body.bg-photo .pref, body.bg-gsistd .pref, body.bg-gsipale .pref{fill:transparent}
body.bg-photo .pref.click:hover, body.bg-gsistd .pref.click:hover, body.bg-gsipale .pref.click:hover{fill:rgba(255,255,255,.12)}
body.bg-photo .pref.sel, body.bg-gsistd .pref.sel, body.bg-gsipale .pref.sel{fill:rgba(255,230,80,.18);stroke:#ffd500;stroke-width:2.2}
body.bg-photo .pref.regsel, body.bg-gsistd .pref.regsel, body.bg-gsipale .pref.regsel{fill:transparent}
body.bg-photo .pref{stroke:rgba(255,255,255,.75)}
body.bg-photo .nb, body.bg-gsistd .nb, body.bg-gsipale .nb{fill:transparent;stroke:none}
body.bg-photo svg{background:#0b1f33}
body.bg-gsistd svg, body.bg-gsipale svg{background:#bcd7ea}
body.bg-photo .plabel{fill:#fff;stroke:rgba(0,0,0,.75)}
body.bg-photo .clabel{fill:#fff;stroke:rgba(0,0,0,.8)}
body.bg-photo .cdot{fill:#fff;stroke:#000}
body.bg-photo .fl.dim{opacity:.45}
body.bg-photo .fl.R{stroke:#d7dde3}
body.bg-photo .fl.S, body.bg-photo .fl.A, body.bg-photo .fl.Z, body.bg-photo .fl.X{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9))}
body.bg-gsistd .lay-city, body.bg-gsipale .lay-city{display:none}
#attr{position:absolute;right:6px;bottom:4px;font-size:10.5px;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:4px;display:none}
#attr a{color:#2b6cb0}
#tilemsg{position:absolute;left:10px;top:52px;max-width:300px;background:#fff7e6;border:1px solid #f0c36d;border-radius:8px;padding:7px 9px;font-size:12px;display:none;line-height:1.5}

#gpswrap{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:4}
#gpsfab{display:flex;align-items:center;gap:6px;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:#1a73e8;
  border:none;border-radius:999px;padding:11px 18px;box-shadow:0 3px 10px rgba(0,0,0,.28);cursor:pointer}
#gpsfab .ic{font-size:18px}
#gpsfab:active{transform:scale(.97)}
#gpsfab.busy{background:#5f6b7a}
#gpsfab.on{background:#0b57d0}
#gpsstop{display:none;position:absolute;right:-6px;top:-8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#444;color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0}
#gpswrap.on #gpsstop{display:block}
#gpsstat{font-size:11.5px;background:rgba(255,255,255,.95);border-radius:6px;padding:2px 8px;color:#0b57d0;font-weight:600;display:none}
#gpswrap.on #gpsstat{display:block}
#manualbtn{font-family:inherit;font-size:11.5px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;color:#333}
#locbox{right:10px;top:auto;bottom:90px}
#attr{bottom:4px}
#tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none;max-width:260px}
aside{width:380px;border-left:1px solid var(--line);background:#fff;overflow:auto;padding:14px 14px 24px}
aside h2{font-size:17px;margin:0 0 2px}
aside .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.card:hover,.card.on{border-color:#888;background:#fafafa}
.rk{flex:none;min-width:34px;text-align:center;font-weight:700;color:#fff;border-radius:5px;padding:3px 4px;font-size:13px}
.rk.S{background:var(--S)} .rk.A{background:var(--A)} .rk.Z{background:var(--Z)} .rk.X{background:var(--X)} .rk.R{background:var(--R)}
.card .nm{font-weight:600;font-size:14px}
.card .sc{font-size:12.5px;color:#444}
.card .pr{font-size:12px;color:var(--muted);margin-top:2px}
aside h3{font-size:14px;margin:14px 0 8px}
.srow{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.rk.sm{min-width:28px;font-size:11px;padding:1px 3px}
.card .nl{font-size:11px;color:#a33;margin-top:2px}
details{margin-top:12px;font-size:13px}
details summary{cursor:pointer;color:var(--muted)}
.refitem{font-size:12.5px;padding:4px 2px;border-bottom:1px dotted var(--line);cursor:pointer}
.refitem:hover{background:#f6f6f6}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.note a{color:#2b6cb0}
.empty{font-size:13px;background:#f7f7f4;border-radius:8px;padding:10px;color:#444;line-height:1.6}
@media (max-width:820px){
  body{display:block}
  main{flex-direction:column;height:auto}
  #mapwrap{flex:none;height:64vh}
  #legend{font-size:10.5px;padding:6px 8px;line-height:1.4}
  aside{width:auto;border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body class="bg-std">
<header>
  <h1>活断層くん <span style="font-size:12px;font-weight:400;color:#6b6f76">全国 活断層マップ</span></h1>
  <div class="sub">都道府県をクリック（タップ）すると、その都道府県の活断層と地震本部の最新評価（ランク・30年確率）を表示します。</div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="mapwrap">
    <svg id="map"></svg>
    <div id="zoombtns"><button id="zin" title="拡大">＋</button><button id="zout" title="縮小">－</button><button id="zall" title="全体">⤢</button><button id="measbtn" title="距離を測る">📏</button></div>
    <div id="measbox"></div>
    <div id="bgctl">背景 <select id="bgsel"><option value="std">標準</option><option value="road">道路・鉄道・都市</option><option value="white">白地図</option><option value="dark">夜間（暗い）</option><option value="photo">航空写真（地理院）</option><option value="gsistd">地理院地図（標準）</option><option value="gsipale">地理院地図（淡色）</option></select></div>
    <div id="tilemsg"></div>
    <div id="gpswrap"><button id="gpsfab"><span class="ic">📍</span><span class="tx">現在地を表示</span></button><button id="gpsstop" title="現在地の表示をやめる">✕</button><div id="gpsstat"></div><button id="manualbtn">地点を手入力・地図で指定</button></div>
    <div id="attr">出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院（地理院タイル）</a></div>
    <div id="pickhint">地図をタップして地点を指定</div>
    <div id="locbox"></div>
    <details id="legend" open><summary><b>地震本部ランク（30年以内確率）</b></summary>
      <div><i style="border-color:var(--S)"></i>S：3%以上</div>
      <div><i style="border-color:var(--A)"></i>A：0.1～3%未満</div>
      <div><i style="border-color:var(--Z)"></i>Z：0.1%未満</div>
      <div><i style="border-color:var(--X)"></i>X：不明（すぐ起きることも否定できない）</div>
      <div><i style="border-color:var(--R);border-top-style:dashed"></i>その他の活断層線（参考）</div>
      <div style="color:#6b6f76">＊は最新活動からの経過率0.7以上</div>
    </details>
    <div id="tip"></div>
  </div>
  <aside id="panel"></aside>
</main>

  else if(it.secs.length===1) h+=`<br>ランク <b>${it.secs[0].r}</b>　M${it.secs[0].M}<br>30年以内：${it.secs[0].p}`;
  else h+=`<br>${it.secs.length}区間（最も高いランク <b>${it.rank}</b>）<br><span style="color:#6b6f76">クリックで区間ごとの評価を表示</span>`;
  t.innerHTML=h; t.style.display='block';
  let x=e.clientX-r.left+12,y=e.clientY-r.top+12; if(x>r.width-270)x-=280;
  t.style.left=x+'px';t.style.top=y+'px';
}

let me=null, picking=false, watchId=null;
function drawMe(){
  gM.selectAll('*').remove();
  if(!me) return;
  const k=d3.zoomTransform(svg.node()).k, [x,y]=proj([me.lon,me.lat]);
  if(me.acc){ // accuracy circle in px
    const yy=proj([me.lon, me.lat + me.acc/111320])[1];
    gM.append('circle').attr('class','me-halo').attr('cx',x).attr('cy',y).attr('r',Math.max(Math.abs(y-yy),10/k));
  } else gM.append('circle').attr('class','me-halo').attr('cx',x).attr('cy',y).attr('r',14/k);
  gM.append('circle').attr('class','me-dot').attr('cx',x).attr('cy',y).attr('r',6/k).attr('stroke-width',2/k);
}
function distKm(lat0,lon0,lines){
  const c=Math.cos(lat0*Math.PI/180); let best=Infinity;
  for(const L of lines){
    for(let i=0;i<L.length;i++){
      const ax=(L[i][0]-lon0)*111.32*c, ay=(L[i][1]-lat0)*110.57;
      if(i===L.length-1){ best=Math.min(best,Math.hypot(ax,ay)); break; }
      const bx=(L[i+1][0]-lon0)*111.32*c, by=(L[i+1][1]-lat0)*110.57;
      const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
      let t=l2? -(ax*dx+ay*dy)/l2 : 0; t=Math.max(0,Math.min(1,t));
      best=Math.min(best,Math.hypot(ax+t*dx, ay+t*dy));
    }
  }
  return best;
}
function prefAt(lon,lat){ const f=DATA.prefs.find(f=>d3.geoContains(f,[lon,lat])); return f?f.properties.n:null; }
function nearList(){
  return DATA.items.filter(i=>!i.ref).map(it=>{
    const per = [];
    (it.zl||[]).length && per.push({d:distKm(me.lat,me.lon,it.zl), r:it.rank, s:''});
    it.secs.forEach(sc=>(sc.l||[]).length && per.push({d:distKm(me.lat,me.lon,sc.l), r:sc.r, s:sc.s}));
    if(!per.length) return null;
    per.sort((a,b)=>a.d-b.d);
    return {it, d:per[0].d, r:per[0].r||it.rank, s:per[0].s};
  }).filter(Boolean).sort((a,b)=>a.d-b.d).slice(0,6);
}
function locBlock(){
  if(!me) return '';
  const pf=prefAt(me.lon,me.lat);
  const L=nearList();
  return `<div class="locblk"><div class="t">📍 ${me.src==='gps'?'現在地':'指定した地点'}${pf?'（'+pf+'）':''}</div>
    <div class="c">北緯 ${me.lat.toFixed(5)}° 東経 ${me.lon.toFixed(5)}°${me.acc?` ｜ 精度 約${Math.round(me.acc)}m`:''}</div>
    <div style="font-size:12px;margin:6px 0 2px;font-weight:600">近い活断層（地震本部の評価対象・線までの距離）</div>
    ${L.map(n=>`<div class="near" data-id="${n.it.id}"><span class="rk sm ${rkey(n.r)}">${n.r}</span><span>${n.it.zone}${n.s?'<br><span style="color:#666">'+n.s+'</span>':''}</span><span class="d">${n.d<1?'1km未満':n.d.toFixed(1)+'km'}</span></div>`).join('')}
    <div class="c" style="margin-top:4px">※距離は地図上の断層線（概略位置）までの直線距離です。</div></div>`;
}
function setMe(lat,lon,acc,src,zoomIt=true){
  me={lat,lon,acc,src};
  const pf=prefAt(lon,lat);
  if(pf && pf!==selPref){ selPref=pf; selReg=byName[pf].properties.r; selItem=null; chips(); restyle(); }
  panel(); drawMe();
  if(zoomIt){
    const r=0.25; // ~25km box
    zoomTo([{type:'Feature',geometry:{type:'MultiPoint',coordinates:[[lon-r,lat-r],[lon+r,lat+r]]}}],20);

}
function parseCoord(t){
  t=t.trim().replace(/，/g,',').replace(/　/g,' ');
  const dms=[...t.matchAll(/(\d+(?:\.\d+)?)\s*[°度]\s*(?:(\d+(?:\.\d+)?)\s*['′分])?\s*(?:(\d+(?:\.\d+)?)\s*["″秒])?\s*([NSEW北南東西])?/gi)];
  if(dms.length>=2){
    const v=dms.slice(0,2).map(m=>{let x=+m[1]+(+m[2]||0)/60+(+m[3]||0)/3600; if(/[SW南西]/i.test(m[4]||''))x=-x; return {x,h:(m[4]||'')};});
    let lat=v[0].x, lon=v[1].x; if(/[EW東西]/i.test(v[0].h)){[lat,lon]=[lon,lat];}
    return [lat,lon];
  }
  const n=t.match(/-?\d+(?:\.\d+)?/g);
  if(n&&n.length>=2){ let a=+n[0], b=+n[1]; if(Math.abs(a)>90) [a,b]=[b,a]; return [a,b]; }
  return null;
}

// ---------- 距離計測 ----------
let measuring=false, mpts=[];
function vincenty(lat1,lon1,lat2,lon2){ // GRS80, returns metres
  const a=6378137, f=1/298.257222101, b=a*(1-f), rad=Math.PI/180;
  const L=(lon2-lon1)*rad, U1=Math.atan((1-f)*Math.tan(lat1*rad)), U2=Math.atan((1-f)*Math.tan(lat2*rad));
  const sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);
  let lam=L, it=0, sS,cS,sig,sA,c2A,c2Sm;
  do{ const sl=Math.sin(lam), cl=Math.cos(lam);
    sS=Math.sqrt((cU2*sl)**2+(cU1*sU2-sU1*cU2*cl)**2); if(sS===0) return 0;
    cS=sU1*sU2+cU1*cU2*cl; sig=Math.atan2(sS,cS); sA=cU1*cU2*sl/sS; c2A=1-sA*sA;
    c2Sm=c2A? cS-2*sU1*sU2/c2A : 0;
    const C=f/16*c2A*(4+f*(4-3*c2A)); var lp=lam;
    lam=L+(1-C)*f*sA*(sig+C*sS*(c2Sm+C*cS*(-1+2*c2Sm*c2Sm)));
  } while(Math.abs(lam-lp)>1e-12 && ++it<200);
  if(it>=200) return d3.geoDistance([lon1,lat1],[lon2,lat2])*6371008.8;
  const u2=c2A*(a*a-b*b)/(b*b), A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2))), B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
  const dS=B*sS*(c2Sm+B/4*(cS*(-1+2*c2Sm*c2Sm)-B/6*c2Sm*(-3+4*sS*sS)*(-3+4*c2Sm*c2Sm)));
  return b*A*(sig-dS);
}
const fmtD = m => m<1000 ? Math.round(m)+' m' : (m<100000 ? (m/1000).toFixed(2) : (m/1000).toFixed(1))+' km';
function cum(){ const c=[0]; for(let i=1;i<mpts.length;i++) c.push(c[i-1]+vincenty(mpts[i-1][1],mpts[i-1][0],mpts[i][1],mpts[i][0])); return c; }
function drawMeas(){
  gMs.selectAll('*').remove();
  if(!mpts.length) return;
  const k=d3.zoomTransform(svg.node()).k, P=mpts.map(p=>proj(p)), C=cum();
  const ln=d3.line(); 
  if(P.length>1){ gMs.append('path').attr('class','ms-line-h').attr('d',ln(P)); gMs.append('path').attr('class','ms-line').attr('d',ln(P)); }
  P.forEach((p,i)=>{
    gMs.append('circle').attr('class','ms-pt').attr('cx',p[0]).attr('cy',p[1]).attr('r',4.5/k).attr('stroke-width',2/k);
    if(i>0) gMs.append('text').attr('class','ms-lab').attr('x',p[0]+7/k).attr('y',p[1]-7/k)
      .style('font-size',(12/k)+'px').style('stroke-width',(3.5/k)+'px').text(fmtD(C[i]));
  });
}
function measPanel(){
  const mb=document.getElementById('measbox');
  if(!measuring){ mb.style.display='none'; return; }
  const C=cum(), n=mpts.length, last = n>1 ? C[n-1]-C[n-2] : 0;
  mb.innerHTML=`<div><b>距離を測る</b>：地図をタップして点を追加</div>
    <div class="tot">${n>1?fmtD(C[n-1]):'—'}</div>
    <div style="color:#666">${n>1?`${n}点 ｜ 最後の区間 ${fmtD(last)}`:'始点をタップしてください'}</div>
    <div class="row">${me?'<button id="msme">現在地を始点に</button>':''}<button id="msundo" ${n?'':'disabled'}>1つ戻す</button><button id="msclr" ${n?'':'disabled'}>クリア</button><button class="pri" id="msend">終了</button></div>
    <div style="color:#888;font-size:11px;margin-top:4px">GRS80楕円体上の距離（地図上でタップした位置の精度に依存）</div>`;
  mb.style.display='block';
  const b=id=>document.getElementById(id);
  if(b('msme')) b('msme').onclick=()=>{ mpts.unshift([me.lon,me.lat]); upd(); };
  b('msundo').onclick=()=>{ mpts.pop(); upd(); };

}
function upd(){ drawMeas(); measPanel(); }
document.getElementById('measbtn').onclick=()=>{

  document.getElementById('measbtn').classList.toggle('on',measuring);
  if(measuring && mpts.length>1) mpts=[];
  upd();
};
svg.on('click.measure',function(e){
  if(!measuring) return;
  const t=d3.zoomTransform(svg.node()), [mx,my]=d3.pointer(e,svg.node());
  mpts.push(proj.invert(t.invert([mx,my]))); upd();
});


// ---------- 地理院タイル ----------
const TILES={
  photo:{url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',min:2,max:18},
  gsistd:{url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',min:5,max:18},
  gsipale:{url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',min:5,max:18},
};
let tileMode=null, tileRaf=0, tileFail=0, tileOk=0;
function scheduleTiles(){ if(!tileMode) return; if(tileRaf) return; tileRaf=requestAnimationFrame(()=>{tileRaf=0; drawTiles();}); }
function drawTiles(){
  if(!tileMode){ gTile.selectAll('image').remove(); return; }
  const T=TILES[tileMode], t=d3.zoomTransform(svg.node());
  const WW=2*Math.PI*proj.scale(), o=proj([-180,85.0511287798]);
  let z=Math.round(Math.log2(WW*t.k/256)); z=Math.max(T.min,Math.min(T.max,z));
  const n=2**z, ts=WW/n;
  const a=t.invert([0,0]), b=t.invert([W,H]);
  const x0=Math.max(0,Math.floor((a[0]-o[0])/ts)), x1=Math.min(n-1,Math.floor((b[0]-o[0])/ts));
  const y0=Math.max(0,Math.floor((a[1]-o[1])/ts)), y1=Math.min(n-1,Math.floor((b[1]-o[1])/ts));
  const list=[];
  if((x1-x0+1)*(y1-y0+1)<=400) for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) list.push({z,x,y,k:z+'/'+x+'/'+y});
  gTile.selectAll('image').data(list,d=>d.k).join(
    en=>en.append('image').attr('href',d=>T.url.replace('{z}',d.z).replace('{x}',d.x).replace('{y}',d.y))
      .attr('preserveAspectRatio','none')
      .on('error',function(){ tileFail++; checkTiles(); d3.select(this).remove(); })
      .on('load',function(){ tileOk++; }),
    up=>up, ex=>ex.remove())
    .attr('x',d=>o[0]+d.x*ts).attr('y',d=>o[1]+d.y*ts).attr('width',ts+0.5/t.k).attr('height',ts+0.5/t.k);
}
function checkTiles(){
  if(tileFail>=4 && tileOk===0){
    const m=document.getElementById('tilemsg');
    m.innerHTML='地理院タイルを読み込めませんでした。この画面（claude.ai上）では外部の地図画像が使えません。スマホアプリ版「活断層くん」（GitHub Pages）では表示されます。電波の弱い所でも表示されないことがあります。';
    m.style.display='block';
  }
}

const bgsel=document.getElementById('bgsel');
function setBg(v){ document.body.className='bg-'+v; bgsel.value=v; try{localStorage.setItem('faultmap-bg',v);}catch(e){}
  tileMode = TILES[v] ? v : null; tileFail=0; tileOk=0;
  document.getElementById('tilemsg').style.display='none';
  document.getElementById('attr').style.display = tileMode ? 'block' : 'none';
  gTile.selectAll('image').remove(); drawTiles(); }
bgsel.onchange=()=>setBg(bgsel.value);
try{ const v=localStorage.getItem('faultmap-bg'); if(v && ['std','road','white','dark','photo','gsistd','gsipale'].includes(v)) setBg(v); }catch(e){}
if(window.innerWidth<820)document.getElementById('legend').removeAttribute('open');
if('serviceWorker' in navigator && location.protocol==='https:'){ try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){} }
chips(); draw(); panel();
const _draw=draw; draw=function(){_draw(); drawMe(); drawMeas(); gTile.selectAll('image').remove(); drawTiles();};
